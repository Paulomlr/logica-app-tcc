services:
  db:
    image: postgres:16-alpine
    container_name: logica_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: logica_app
      POSTGRES_USER: logica_app
      POSTGRES_PASSWORD: logica_app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logica_app -d logica_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: maven:3.9-eclipse-temurin-21
    container_name: logica_backend
    working_dir: /app
    command: ["mvn", "spring-boot:run"]
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/logica_app
      SPRING_DATASOURCE_USERNAME: logica_app
      SPRING_DATASOURCE_PASSWORD: logica_app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: logica_frontend
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080

volumes:
  db_data:
  maven_cache:
  frontend_node_modules:
